[project]
name = "investor-os-backend"
version = "0.1.0"
description = "FastAPI backend for the Investor OS local portfolio and options dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "ibapi>=9.81.1.post1",
    "pydantic>=2.13.4",
    "tzdata>=2026.2",
    "uvicorn>=0.48.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.investor_os.performance_baseline]
iterations = 10
portfolio_positions = 250
option_chain_rows = 120
